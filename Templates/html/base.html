<!-- base.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <meta name="description" content="BodhGaya Joshi Mathh - A serene place for spiritual retreat and community gatherings.">
    <meta name="keywords" content="BodhGaya, Joshi Mathh, Spiritual Retreat, Community, Temple, Pilgrimage">
    <meta name="author" content="BodhGaya Joshi Mathh">
    <link rel="icon" href="/static/images/logo.jpg" type="image/x-icon">
    <title>{% block title %}{% endblock %}  | BodhGaya Math</title>
    <!-- Include Bootstrap JS at end of body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Add this in the <head> or before the closing </body> tag -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <!-- Your custom styles -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_head %}{% endblock %}
    <style>
/* Footer */
/* Footer Collage Image */
.responsive-image-container {
    width: 100%;
    position: relative;
    overflow: hidden;
    /* max-width: 1280px; */
    margin: 0 auto;
    /* border-radius: 12px; */
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
}

/* Collage Image with gradient border and animation */
.footer-collage-image {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: block;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-image: linear-gradient(to left, #65A29A, #4D809F, #98649D, #D04843, #F47527, #FFA500);
    border-image-slice: 1;
    animation: fadeIn 1.5s ease-in-out;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

/* Hover effect for interactivity */
.footer-collage-image:hover {
    transform: scale(1.01);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

/* Optional overlay */
.footer-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-family: 'PT Serif', serif;
    font-size: 1.5rem;
    letter-spacing: 1px;
    text-align: center;
    white-space: nowrap;
}

/* Responsive height adjustments */
@media (max-width: 1024px) {
    .footer-collage-image {
        height: 260px;
    }
}

@media (max-width: 768px) {
    .footer-collage-image {
        height: 220px;
    }
}

@media (max-width: 480px) {
    .footer-collage-image {
        height: 180px;
    }
}

/* Fade-in animation */
@keyframes fadeIn {
    0% {
        opacity: 0;
        transform: scale(1.02);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}


footer ul li {
    margin-bottom: 8px;
}

.list-unstyled li {
    margin-bottom: 8px;
    font-family: Inter, sans-serif;
    font-size: 12px;
}

footer h6 {
    color: var(--pilgrim-hover);
    /* optional highlight color */
    font-family: "PT Serif", serif;
    font-size: 15px;
}

footer p {
    /* optional highlight color */
    font-family: "PT Serif", serif;
    font-size: 15px;
}

footer a {
    color: #4d809f;
    text-decoration: none;
}

footer a:hover {
    text-decoration: underline;
    color: #306584;
}

:root {
    --gray-100: #f7f2ec;
    --gray-200: #ebe3d9;
    --brown-light: #b4a597;
    --brown-medium: #7e6f5c;
    --brown-dark: #4b3729;
    --learn-more: #f56f1c;
    --events: orange;
    --events-hover: #f49600;
    --pilgrim: #f47527;
    --pilgrim-hover: #e26114;
    --resources: #d04843;
    --resources-hover: #ba3933;
    --online-services: #98649d;
    --online-services-hover: #834c88;
    --about: #4d809f;
    --about-hover: #306584;
    --contact: #65a29a;
    --contact-hover: #468981;
}
    </style>
</head>

<body>

    <!-- Navbar -->
    {% include 'partials/navbar.html' %}
    <!-- Carousel (only if you want to show on all pages, or move it to homepage) -->
    {% block hero %}{% endblock %}

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    
    {% include 'partials/footer.html' %}

    <script src="{% static 'js/base.js' %}"></script>
    {% block scripts %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
        integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
        crossorigin="anonymous"></script>
</body>

</html>
